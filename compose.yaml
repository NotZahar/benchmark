services:
  transport-benchmark:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: missing
    image: transport-benchmark-image:latest
    container_name: transport-benchmark-container
    ipc: host # NOTE: For shared memory (iceoryx)
    network_mode: host # NOTE: For native DDS latency
    privileged: true
    cap_add:
      - SYS_NICE # NOTE: Real-time scheduling
      - IPC_LOCK # NOTE: Memory locking - no swap
    ulimits:
      memlock: -1 # NOTE: Unlimited memory locking
    volumes:
      - ./workspace:/root/workspace
      # - /usr/lib/linux-tools/${KERNEL_VERSION}/perf:/usr/bin/perf:ro # host is Ubuntu 24
      - /usr/bin/perf:/usr/bin/perf:ro # host is Ubuntu 25
    tty: true
    stdin_open: true
