[package]
name = "rust_zenoh"
build = "build.rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "rust_zenoh"
path = "src/lib.rs"

[[bin]]
name = "publisher"
path = "src/publisher.rs"

[[bin]]
name = "subscriber"
path = "src/subscriber.rs"

[dependencies]
anyhow = "1.0.100"
flatbuffers = "25.12.19"
libc = "0.2.177"
serde = "1.0.228"
serde_yaml = "0.9.34"
zenoh = { version = "1.9.0", features = ["shared-memory", "unstable"] }
